<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trinity Fall Clean-Up Day</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Georgia,'Times New Roman',serif;background:radial-gradient(ellipse at 50% 30%,#fff0c7 0%,#f7c47b 45%,#a94523 100%);color:#492517}.screen{height:100vh;width:100vw;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;text-align:center;padding:3vh 6vw;border:1.5vw solid #763c20;outline:.45vw solid #e6a647;outline-offset:-2.3vw}.screen:before{content:"";position:absolute;inset:2.9vw;border:3px solid #d98a39;border-radius:1.5vw;pointer-events:none}.leaf{position:absolute;font-size:clamp(28px,5vw,90px);filter:drop-shadow(2px 4px 2px #7c4a2944)}.a{left:3%;top:5%;transform:rotate(-20deg)}.b{right:3%;top:7%;transform:rotate(20deg)}.c{left:4%;bottom:6%;transform:rotate(35deg)}.d{right:4%;bottom:6%;transform:rotate(-30deg)}.church{font-family:Arial,sans-serif;letter-spacing:.3em;text-transform:uppercase;font-weight:800;font-size:clamp(14px,1.9vw,35px)}h1{font-size:clamp(36px,5.5vw,105px);line-height:1.02;margin:0;color:#792e19;text-shadow:1px 2px #ffe3a2}.subtitle{font-size:clamp(22px,2.8vw,54px);font-weight:bold;margin:0}.date{font-family:Arial,sans-serif;font-weight:900;font-size:clamp(24px,3.1vw,62px);color:#6c2d1d}.time{font-size:clamp(21px,2.6vw,48px);font-family:Arial,sans-serif;font-weight:700}.count{display:flex;align-items:center;gap:1.4vw;background-image:url('fall-background.jpg');
background-size:cover;
background-position:center;border:5px solid #9e5529;border-radius:22px;padding:1vh 3vw;box-shadow:0 7px 20px #66331344}.number{font-family:Arial,sans-serif;font-weight:900;font-size:clamp(60px,8vw,150px);line-height:1;color:#8c381e}.countlabel{font-family:Arial,sans-serif;text-transform:uppercase;letter-spacing:.08em;text-align:left;font-weight:900;font-size:clamp(17px,2vw,38px);color:#6a341d}.lunch{font-family:Arial,sans-serif;font-size:clamp(22px,2.6vw,50px);font-weight:900;color:#672e19}.small{font-family:Arial,sans-serif;font-size:clamp(11px,1vw,18px)}@media(max-aspect-ratio:1/1){.screen{padding:8vh 7vw}.leaf{font-size:7vw}h1{font-size:9vw}.subtitle{font-size:4.6vw}.date{font-size:5vw}.time{font-size:4.5vw}.number{font-size:15vw}.countlabel{font-size:3.4vw}.lunch{font-size:4.5vw}}
</style></head><body {
  background-image: url('fall-background.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}><main class="screen"><span class="leaf a">🍁</span><span class="leaf b">🍂</span><span class="leaf c">🍂</span><span class="leaf d">🍁</span><div class="church">Trinity United Methodist Church</div><h1>Fall Clean-Up Day<br>at Trinity!</h1><p class="subtitle">Bring your gloves and let's tidy up Trinity!</p><div class="date">Saturday, October 17, 2026</div><div class="time">9:00 AM – 1:00 PM</div><div class="count" aria-live="polite"><span class="number" id="days">--</span><span class="countlabel" id="countlabel">Days Until<br>Clean-Up!</span></div><div class="lunch">🌭 Hot Dog Lunch Provided! 🌭</div></main><script>
function updateCountdown(){const now=new Date();const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());const event=new Date(2026,9,17);const days=Math.max(0,Math.round((event-today)/86400000));document.getElementById('days').textContent=days;document.getElementById('countlabel').innerHTML=today>event?'Event<br>Completed':today.getTime()===event.getTime()?'Clean-Up<br>Is Today!':'Days Until<br>Clean-Up!';}updateCountdown();setInterval(updateCountdown,60000);
</script></body></html>
