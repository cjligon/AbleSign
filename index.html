<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Christmas Bazaar Countdown</title>

<style>

html, body {

    margin: 0;

    width: 100%;

    height: 100%;

}

body {

    font-family: Arial, Helvetica, sans-serif;

    background: linear-gradient(135deg, #7b2d26, #c66a2d, #e3a33b);

    display: flex;

    justify-content: center;

    align-items: center;

    color: #4b2919;

}

.card {

    width: 88%;

    max-width: 1200px;

    padding: 45px;

    box-sizing: border-box;

    background: #fff8e7;

    border: 16px solid #8b3f24;

    border-radius: 35px;

    text-align: center;

}

h1 {

    margin: 0 0 15px 0;

    font-size: 64px;

    color: #8b3f24;

}

.subtitle {

    font-size: 34px;

    margin-bottom: 25px;

}

.number {

    font-size: 150px;

    line-height: 1;

    font-weight: bold;

    color: #c65d25;

}

.label {

    font-size: 42px;

    font-weight: bold;

    margin-top: 10px;

}

.date {

    font-size: 36px;

    font-weight: bold;

    margin-top: 25px;

    color: #6b3524;

}

.church {

    font-size: 30px;

    font-weight: bold;

    margin-top: 18px;

    color: #8b3f24;

}

</style>

</head>

<body>

<div class="card">

    <h1>CHRISTMAS BAZAAR</h1>

    <div class="subtitle">The Countdown Is On!</div>

    <div id="days" class="number">--</div>

    <div class="label">DAYS UNTIL THE BAZAAR</div>

    <div class="date">NOVEMBER 14, 2026</div>

    <div class="church">Trinity United Methodist Church</div>

</div>

<script>

function updateCountdown() {

    const now = new Date();

    const today = new Date(

        now.getFullYear(),

        now.getMonth(),

        now.getDate()

    );

    const bazaar = new Date(2026, 10, 14);

    const difference = bazaar - today;

    const days = Math.max(

        0,

        Math.ceil(difference / 86400000)

    );

    document.getElementById("days").textContent = days;

}

updateCountdown();

setInterval(updateCountdown, 60000);

</script>

</body>

</html>
