<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Christmas Bazaar Countdown</title>

<style>

html, body {

  margin: 0;

  width: 100%;

  height: 100%;

}

body {

  background: #b85c2b;

  color: #6b2d1a;

  font-family: Arial, Helvetica, sans-serif;

  text-align: center;

}

.frame {

  background: #fff4d6;

  border: 14px solid #7b321d;

  border-radius: 30px;

  width: 90%;

  height: 86%;

  margin: 3% auto;

  padding: 25px;

}

h1 {

  font-size: 64px;

  margin: 15px 0 5px 0;

  color: #7b321d;

}

.subtitle {

  font-size: 32px;

  margin: 5px 0 15px 0;

}

.countbox {

  background: #f4b942;

  border: 8px solid #7b321d;

  border-radius: 25px;

  width: 280px;

  height: 190px;

  margin: 15px auto;

  display: flex;

  align-items: center;

  justify-content: center;

}

#days {

  font-size: 120px;

  font-weight: bold;

  line-height: 1;

}

.label {

  font-size: 38px;

  font-weight: bold;

  margin: 10px 0 20px 0;

}

.date {

  font-size: 38px;

  font-weight: bold;

  margin: 10px 0;

}

.church {

  font-size: 28px;

  font-weight: bold;

  margin-top: 20px;

}

</style>

</head>

<body>

<div class="frame">

  <h1>CHRISTMAS BAZAAR</h1>

  <div class="subtitle">

    The Countdown Is On!

  </div>

  <div class="countbox">

    <div id="days">49</div>

  </div>

  <div class="label">

    DAYS UNTIL THE BAZAAR

  </div>

  <div class="date">

    NOVEMBER 14, 2026

  </div>

  <div class="church">

    Trinity United Methodist Church

  </div>

</div>

<script>

function updateCountdown() {

  var today = new Date();

  today = new Date(

    today.getFullYear(),

    today.getMonth(),

    today.getDate()

  );

  var bazaar = new Date(2026, 10, 14);

  var difference = bazaar - today;

  var days = Math.ceil(

    difference / (1000 * 60 * 60 * 24)

  );

  if (days < 0) {

    days = 0;

  }

  document.getElementById("days").textContent = days;

}

updateCountdown();

setInterval(updateCountdown, 60000);

</script>

</body>

</html>
