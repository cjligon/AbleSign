<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Christmas Bazaar Countdown</title>

<style>

* {

  box-sizing: border-box;

}

html, body {

  margin: 0;

  width: 100%;

  height: 100%;

}

body {

  font-family: Arial, Helvetica, sans-serif;

  background: linear-gradient(135deg, #7b2d26, #c66a2d, #e3a33b);

  display: flex;

  justify-content: center;

  align-items: center;

  color: #4b2919;

  overflow: hidden;

}

.frame {

  width: 94vw;

  height: 90vh;

  background: #fff8e7;

  border: 16px solid #8b3f24;

  border-radius: 35px;

  box-shadow: 0 0 30px rgba(0,0,0,.35);

  display: flex;

  flex-direction: column;

  justify-content: center;

  align-items: center;

  text-align: center;

  padding: 30px;

}

.title {

  font-size: clamp(38px, 6vw, 82px);

  font-weight: 800;

  color: #8b3f24;

  margin: 0 0 10px;

}

.subtitle {

  font-size: clamp(22px, 3vw, 42px);

  color: #b85c2b;

  margin-bottom: 15px;

}

.count-box {

  min-width: 260px;

  min-height: 210px;

  padding: 10px 40px;

  background: #f4b942;

  border: 8px solid #8b3f24;

  border-radius: 30px;

  display: flex;

  justify-content: center;

  align-items: center;

  margin: 10px 0 12px;

  box-shadow: 0 8px 15px rgba(0,0,0,.2);

}

#days {

  font-size: clamp(90px, 14vw, 180px);

  line-height: 1;

  font-weight: 900;

  color: #7b2d26;

}

.days-text {

  font-size: clamp(28px, 4vw, 56px);

  font-weight: 800;

  color: #8b3f24;

  margin-bottom: 15px;

}

.date {

  font-size: clamp(28px, 4vw, 58px);

  font-weight: 800;

  color: #6b3524;

}

.church {

  margin-top: 18px;

  font-size: clamp(20px, 2.5vw, 38px);

  font-weight: 700;

  color: #8b3f24;

}

</style>

</head>

<body>

<div class="frame">

  <div class="title">CHRISTMAS BAZAAR</div>

  <div class="subtitle">The Countdown Is On!</div>

  <div class="count-box">

    <div id="days">--</div>

  </div>

  <div class="days-text">DAYS UNTIL THE BAZAAR</div>

  <div class="date">NOVEMBER 14, 2026</div>

  <div class="church">Trinity United Methodist Church</div>

</div>

<script>

function updateCountdown() {

  const now = new Date();

  const target = new Date(

    now.getFullYear() === 2026 ? 2026 : 2026,

    10,

    14

  );

  const today = new Date(

    now.getFullYear(),

    now.getMonth(),

    now.getDate()

  );

  const bazaar = new Date(2026, 10, 14);

  const difference = bazaar - today;

  const days = Math.max(0, Math.ceil(difference / 86400000));

  document.getElementById("days").textContent = days;

}

updateCountdown();

setInterval(updateCountdown, 60000);

</script>

</body>

</html>
