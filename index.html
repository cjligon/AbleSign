<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Christmas Bazaar Countdown</title>

<style>

  * {

    box-sizing: border-box;

  }

  html, body {

    margin: 0;

    width: 100%;

    height: 100%;

    overflow: hidden;

  }

  body {

    font-family: Arial, Helvetica, sans-serif;

    background: linear-gradient(135deg, #7b2d26, #c56a2d, #e3a33b);

    display: flex;

    justify-content: center;

    align-items: center;

    color: #4b2118;

  }

  .frame {

    width: 94vw;

    height: 90vh;

    background: #fff8e7;

    border: 18px solid #8b3f24;

    border-radius: 35px;

    box-shadow: 0 0 30px rgba(0,0,0,.35);

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    padding: 30px;

  }

  h1 {

    margin: 0 0 25px;

    font-family: Georgia, serif;

    font-size: clamp(42px, 7vw, 105px);

    color: #7b2d26;

    line-height: 1;

  }

  .subtitle {

    font-size: clamp(24px, 3vw, 48px);

    font-weight: bold;

    color: #a14c27;

    margin-bottom: 25px;

  }

  .countbox {

    background: #7b2d26;

    color: white;

    min-width: 35%;

    padding: 20px 60px 28px;

    border-radius: 30px;

    box-shadow: 0 8px 18px rgba(0,0,0,.25);

    margin: 10px 0 25px;

  }

  #days {

    font-size: clamp(90px, 16vw, 230px);

    font-weight: 800;

    line-height: .95;

  }

  .days-label {

    font-size: clamp(22px, 3vw, 46px);

    font-weight: bold;

    margin-top: 12px;

  }

  .date {

    font-family: Georgia, serif;

    font-size: clamp(28px, 4vw, 58px);

    font-weight: bold;

    color: #6b3524;

  }

  .church {

    margin-top: 18px;

    font-size: clamp(20px, 2.5vw, 38px);

    font-weight: bold;

    color: #8b3f24;

  }

</style>

</head>

<body>

<div class="frame">

  <h1>CHRISTMAS BAZAAR</h1>

  <div class="subtitle">The Countdown Is On!</div>

  <div class="countbox">

    <div id="days">--</div>

    <div class="days-label">DAYS UNTIL THE BAZAAR</div>

  </div>

  <div class="date">NOVEMBER 14, 2026</div>

  <div class="church">Trinity United Methodist Church</div>

</div>

<script>

  function updateCountdown() {

    const now = new Date();

    const target = new Date(2026, 10, 14);

    

    now.setHours(0, 0, 0, 0);

    target.setHours(0, 0, 0, 0);

    const difference = target - now;

    const days = Math.max(0, Math.ceil(difference / 86400000));

    document.getElementById("days").textContent = days;

  }

  updateCountdown();

  setInterval(updateCountdown, 60000);

</script>

</body>

</html>
