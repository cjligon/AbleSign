<script>
(() => {
  'use strict';
  const target = Date.UTC(2026, 10, 14); // November 14, 2026
  const zone = 'America/New_York'; // Trinity UMC local calendar day
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: zone, year: 'numeric', month: 'numeric', day: 'numeric'
  });
  const label = document.getElementById('days');

  function update() {
    const date = Object.fromEntries(parts.formatToParts(new Date())
      .filter(part => part.type !== 'literal')
      .map(part => [part.type, Number(part.value)]));
    const today = Date.UTC(date.year, date.month - 1, date.day);
    const days = Math.max(0, Math.round((target - today) / 86400000));
    label.textContent = String(days);
    label.style.fontSize = days >= 100 ? '91px' : '123px';
    label.style.letterSpacing = days >= 100 ? '-5px' : '-9px';
    document.querySelector('.slide').setAttribute('aria-label',
      `${days} days until Trinity UMC Christmas Bazaar, Saturday November 14, 2026`);
  }

  update();
  setInterval(update, 60 * 1000);
  document.addEventListener('visibilitychange', update);
  window.addEventListener('pageshow', update);
})();
</script>
</body>
</html>
